name: 编译 APK

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 智能归一化文件（无论带不带序号都能自动识别）
        run: |
          set -e
          echo "===== 仓库根目录实际文件 ====="
          ls -la

          # 找出真正的 main.dart（可能被命名成 01_main.dart / mistake_main.dart 等）
          SRC_MAIN=$(find . -maxdepth 1 -type f -iname '*main*.dart' | head -1)
          SRC_PUB=$(find . -maxdepth 1 -type f -iname '*pubspec*.yaml' | head -1)
          SRC_TPL=$(find . -maxdepth 1 -type f -iname '*template*.docx' | head -1)

          echo "识别到 main 文件: $SRC_MAIN"
          echo "识别到 pubspec 文件: $SRC_PUB"
          echo "识别到 模板 文件: $SRC_TPL"

          if [ -z "$SRC_MAIN" ]; then echo "错误：找不到 main.dart"; exit 1; fi
          if [ -z "$SRC_PUB" ]; then echo "错误：找不到 pubspec.yaml"; exit 1; fi
          if [ -z "$SRC_TPL" ]; then echo "错误：找不到 docx 模板"; exit 1; fi

          # 归一化为标准名（源文件与目标同名时跳过，避免 cp 报 same file）
          safe_copy() {
            local src="$1"
            local dst="$2"
            if [ "$src" = "./$dst" ] || [ "$src" = "$dst" ]; then
              echo "跳过（已是标准名）: $dst"
            else
              cp "$src" "$dst"
              echo "已复制: $src -> $dst"
            fi
          }
          safe_copy "$SRC_MAIN" main.dart
          safe_copy "$SRC_PUB" pubspec.yaml
          safe_copy "$SRC_TPL" mistake_template.docx
          echo "归一化完成：main.dart / pubspec.yaml / mistake_template.docx"

          # 自动修复旧代码里的联网字体（CI 环境下载字体会失败）
          if grep -q 'PdfGoogleFonts' main.dart; then
            echo "检测到 PdfGoogleFonts，自动替换为内置字体..."
            sed -i 's/await PdfGoogleFonts\.notoSansSCRegular()/pw.Font.helvetica()/g' main.dart
            sed -i 's/await PdfGoogleFonts\.notoSansSCBold()/pw.Font.helveticaBold()/g' main.dart
            sed -i 's/PdfGoogleFonts\.notoSansSCRegular()/pw.Font.helvetica()/g' main.dart
            sed -i 's/PdfGoogleFonts\.notoSansSCBold()/pw.Font.helveticaBold()/g' main.dart
            echo "替换完成"
          fi

          # 自动修复 permission_handler：若代码里有 import 但 pubspec 里没声明，删掉相关 import
          if grep -q 'permission_handler' main.dart && ! grep -q 'permission_handler' pubspec.yaml; then
            echo "检测到废弃的 permission_handler 引用，自动清理..."
            sed -i "/package:permission_handler/d" main.dart
            echo "清理完成"
          fi

          # 自动修复 pubspec 里的 ^ 通配符（会导致升级到要求更高 Flutter 的版本）
          if grep -qE '^\s+[a-z_]+:\s*\^' pubspec.yaml; then
            echo "检测到 ^ 通配符，自动改为精确版本锁定..."
            sed -i -E 's/^(\s+[a-z_0-9]+):\s*\^([0-9.]+)/\1: \2/' pubspec.yaml
          fi
          echo "最终 pubspec.yaml 依赖："
          cat pubspec.yaml

      - name: 组装工程结构
        run: |
          set -e
          mkdir -p lib
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/kotlin/com/example/mistake_book
          mkdir -p android/gradle/wrapper
          cp main.dart lib/main.dart

          # ---------- AndroidManifest.xml ----------
          cat > android/app/src/main/AndroidManifest.xml << 'XMLEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:label="错题本"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SEND" />
                      <data android:mimeType="*/*" />
                  </intent>
              </queries>
          </manifest>
          XMLEOF

          cat > android/app/src/main/res/xml/file_paths.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <external-files-path name="ext_files" path="." />
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          XMLEOF

          cat > android/app/src/main/res/values/styles.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          XMLEOF

          cat > android/app/src/main/kotlin/com/example/mistake_book/MainActivity.kt << 'KTEOF'
          package com.example.mistake_book

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          KTEOF

          # ---------- 关键：使用 Flutter 提供的版本变量，不写死 ----------
          cat > android/app/build.gradle << 'GEOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) { flutterVersionCode = '1' }
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) { flutterVersionName = '1.0.0' }

          android {
              namespace "com.example.mistake_book"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.example.mistake_book"
                  minSdkVersion flutter.minSdkVersion
                  targetSdkVersion flutter.targetSdkVersion
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          GEOF

          cat > android/settings.gradle << 'GEOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.7.10" apply false
          }

          include ":app"
          GEOF

          cat > android/build.gradle << 'GEOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GEOF

          cat > android/gradle.properties << 'GEOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8.fullMode=false
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configureondemand=false
          GEOF

          # ---------- 关键：Gradle 8.3 与 AGP 8.1.0 官方匹配 ----------
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'GEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          GEOF

          # 生成应用图标（避免 @mipmap/ic_launcher 缺失）
          python3 -c "
          import base64, os
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          for d in ['mipmap-hdpi','mipmap-mdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
              p = 'android/app/src/main/res/' + d
              os.makedirs(p, exist_ok=True)
              open(p + '/ic_launcher.png','wb').write(png)
          print('图标已生成')
          "

          echo "工程结构组装完成"

      - name: 创建 local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          cat android/local.properties

      - name: 获取依赖
        run: flutter pub get

      - name: 代码预检（有 error 就直接停下并打印行号）
        run: |
          echo "===== flutter analyze 结果 ====="
          set +e
          flutter analyze lib/main.dart 2>&1 | tee /tmp/analyze.log
          if grep -qE "^\s+error •" /tmp/analyze.log; then
            echo ""
            echo "❌❌❌ 检测到编译错误（error），下面是具体位置： ❌❌❌"
            grep -E "^\s+error •" /tmp/analyze.log
            echo ""
            echo "请把上面这几行发给开发者定位。"
            exit 1
          fi
          echo "✅ 代码预检通过，没有 error"

      - name: 检查环境资源
        run: |
          echo "内存总量:"
          free -h
          echo "CPU:"
          nproc

      - name: 编译 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
